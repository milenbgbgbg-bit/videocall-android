name: Build APK

# Builds the Android app entirely in the cloud, no local Android Studio needed.
# Runs automatically whenever you push/upload changes to this repo.
# The finished .apk shows up under the "Actions" tab -> the latest run -> "Artifacts".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners already ship a full Android SDK with licenses
      # pre-accepted, so no separate Android SDK setup step is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-call-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
