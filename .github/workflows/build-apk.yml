name: Build APK

# Builds the Android app entirely in the cloud, no local Android Studio needed.
# Runs automatically whenever you push/upload changes to this repo.
# The finished .apk is published as a GitHub Release - always at:
#   https://github.com/milenbgbgbg-bit/videocall-android/releases/latest
# That link needs no GitHub login and always has the newest build.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradlew wrapper is committed to this repo, so we install Gradle
      # directly and run the plain 'gradle' command instead of './gradlew'.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: video-call-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a Release (stable download link, no login)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk videocall.apk
          gh release create "build-${{ github.run_number }}" videocall.apk \
            --title "Видео разговори - build ${{ github.run_number }}" \
            --notes "Автоматичен билд от commit ${{ github.sha }}. Свали videocall.apk и го инсталирай на телефона."
